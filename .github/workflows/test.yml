name: test

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.emacs-version == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ['29.1', '30.1', '30.2', '31.1', 'snapshot']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: ${{ matrix.emacs-version }}
      - name: Show version
        run: emacs --version
      - name: Byte-compile, checkdoc, package-lint, relint and test
        run: make

  # The console build is enough for a pseudo terminal, and the pyte
  # screen shows what a terminal user really sees.
  tty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5 # v8.0
        with:
          version: '30.2'
      - name: Install pyte
        run: python3 -m pip install --user pyte
      - name: Box in a terminal
        run: make tty

  # The pixel test needs an Emacs with X support in a virtual display;
  # it also guards a crash that only a graphic side window shows.
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Emacs, a virtual display and pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq xvfb emacs-gtk
          python3 -m pip install --user pillow
      - name: Box measured pixel by pixel
        run: make gui
