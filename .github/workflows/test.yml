name: test

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.emacs-version == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ['29.1', '30.1', '30.2', 'snapshot']
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}
      - name: Show version
        run: emacs --version
      - name: Byte-compile, checkdoc, package-lint and test
        run: make

  # The console build is enough for a pseudo terminal, and the pyte
  # screen shows what a terminal user really sees.
  tty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: '30.2'
      - name: Install pyte
        run: python3 -m pip install --user pyte
      - name: Box in a terminal
        run: make tty
